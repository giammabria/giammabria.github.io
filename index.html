<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gianmaria Brianese — CV</title>
  <meta name="description" content="CV of Gianmaria Brianese — data science and banking supervision.">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #16202b;
      --muted: #667487;
      --bg: #ffffff;
      --border: #dde3ea;
      --accent: #1f3b57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6ebf1;
        --muted: #93a1b3;
        --bg: #10151b;
        --border: #2a323c;
        --accent: #8fb6dd;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 34rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.5;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
    p.subtitle { color: var(--muted); margin: 0; }
    p.location { color: var(--muted); margin: 0.25rem 0 0; font-size: 0.9rem; }
    .links { display: flex; gap: 0.75rem; margin: 2.5rem 0; flex-wrap: wrap; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.15rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      color: var(--fg);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .links a:hover, .links a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    .flag {
      display: inline-block;
      width: 1.2rem;
      height: 0.9rem;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35);
      overflow: hidden;
      flex-shrink: 0;
    }
    .flag svg { display: block; width: 100%; height: 100%; }
    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1.25rem;
      font-size: 0.85rem;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Gianmaria Brianese</h1>
  <p class="subtitle">Data science · Banking supervision</p>
  <p class="location">Frankfurt am Main, Germany</p>

  <div class="links">
    <a href="cv-en.pdf">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice">
          <clipPath id="uk-outer"><rect width="60" height="30"/></clipPath>
          <clipPath id="uk-diag"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#uk-outer)">
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 60,30 M60,0 0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 60,30 M60,0 0,30" clip-path="url(#uk-diag)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </span>
      CV (English, PDF)
    </a>
    <a href="cv-it.pdf">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 3 2" preserveAspectRatio="xMidYMid slice">
          <rect width="1" height="2" fill="#009246"/>
          <rect x="1" width="1" height="2" fill="#fff"/>
          <rect x="2" width="1" height="2" fill="#CE2B37"/>
        </svg>
      </span>
      Curriculum (italiano, PDF)
    </a>
  </div>

  <footer>
    <a href="https://github.com/giammabria">GitHub</a>
    <a href="https://www.linkedin.com/in/gianmaria-brianese/">LinkedIn</a>
  </footer>
</body>
</html>
