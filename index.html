<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gianmaria Brianese — CV</title>
  <meta name="description" content="CV of Gianmaria Brianese — data science and banking supervision.">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #16202b;
      --muted: #667487;
      --bg: #ffffff;
      --border: #dde3ea;
      --accent: #1f3b57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6ebf1;
        --muted: #93a1b3;
        --bg: #10151b;
        --border: #2a323c;
        --accent: #8fb6dd;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 34rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.5;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
    p.subtitle { color: var(--muted); margin: 0; }
    p.location { color: var(--muted); margin: 0.25rem 0 0; font-size: 0.9rem; }
    .links { display: flex; gap: 0.75rem; margin: 2.5rem 0; flex-wrap: wrap; }
    .links a {
      padding: 0.7rem 1.15rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      color: var(--fg);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .links a:hover, .links a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    footer {
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1.25rem;
      font-size: 0.85rem;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Gianmaria Brianese</h1>
  <p class="subtitle">Data science · Banking supervision</p>
  <p class="location">Frankfurt am Main, Germany</p>

  <div class="links">
    <a href="cv-en.pdf">CV (English, PDF)</a>
    <a href="cv-it.pdf">CV (italiano, PDF)</a>
  </div>

  <footer>
    <a href="https://github.com/giammabria">GitHub</a>
    <a href="https://www.linkedin.com/in/gianmaria-brianese/">LinkedIn</a>
  </footer>
</body>
</html>
