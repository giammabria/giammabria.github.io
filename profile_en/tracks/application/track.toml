# Track: Application (English only, built locally, never published).
# PUBLIC-SAFE DATA ONLY, like profile_en/metadata.toml.
#
# The working track for a CV tailored to one specific application: rewrite
# the headline and the modules for the role at hand, build, send. Unlike ds
# and de it has no fixed audience; git history keeps the earlier versions.
# This repository is public, so name neither the company nor the role here.
#
# Merged over metadata.toml by cv.typ when compiled with
# --input track=application. `modules` are included in order from this
# directory. A [layout] table may override flat layout keys (spacing,
# date_width); nested tables such as [layout.header] are not merged.

header_quote = "Analytics and data engineer with four years at the European Central Bank, owning a 100+ table data lab modelled in SQL and Spark and shipped through CI-tested pipelines, and turning its data into Tableau and Power BI reporting and analyses for senior management and national authorities in 21 countries."

modules = [
  "experience",
  # "projects",
  "education",
  "skills",
  "certificates",
]

# More air than the shared defaults: this version has room to spare on one page.
[layout]
before_section_skip = "6pt"
before_entry_skip = "0pt"
before_entry_description_skip = "-3pt"
font_size = "9pt"
